<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ACG Trader</title>
    <meta name="theme-color" content="#050b12" />
    <style>
      html,body,#root{margin:0;min-height:100%;background:#050b12}
      body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .acg-boot{position:fixed;inset:0;display:grid;place-items:center;background:
        radial-gradient(circle at 50% 20%,rgba(30,88,126,.16),transparent 34%),#050b12;color:#f5f8fb}
      .acg-boot-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
      .acg-boot-mark{display:grid;width:52px;height:52px;place-items:center;border:1px solid #1b3447;border-radius:16px;background:#0a1823;
        box-shadow:inset 0 1px rgba(255,255,255,.03),0 14px 40px rgba(0,0,0,.3);font-size:18px;font-weight:900;letter-spacing:-.04em}
      .acg-boot-title{margin-top:14px;font-size:15px;font-weight:800;letter-spacing:-.02em}
      .acg-boot-copy{margin-top:6px;font-size:11px;font-weight:600;color:#71869a}
      .acg-boot-line{position:relative;margin-top:18px;width:132px;height:2px;overflow:hidden;border-radius:999px;background:#10202c}
      .acg-boot-line:after{content:"";position:absolute;inset:0;width:42%;border-radius:inherit;background:#55c8ff;
        animation:acgBoot 1.05s ease-in-out infinite}
      @keyframes acgBoot{0%{transform:translateX(-130%)}50%{transform:translateX(115%)}100%{transform:translateX(310%)}}
      @media (prefers-reduced-motion: reduce){.acg-boot-line:after{animation:none;left:29%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="acg-boot" role="status" aria-label="Preparing ACG Trader">
        <div class="acg-boot-card">
          <div class="acg-boot-mark">ACG</div>
          <div class="acg-boot-title">ACG Trader</div>
          <div class="acg-boot-copy">Preparing your trading session…</div>
          <div class="acg-boot-line" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

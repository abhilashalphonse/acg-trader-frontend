<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ACG Trader</title>
    <link rel="icon" type="image/png" href="/acg-logo.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/acg-logo.png?v=2" />
    <link rel="apple-touch-icon" href="/acg-logo.png?v=2" />
    <meta name="theme-color" content="#050b12" />
    <style>
      html,body,#root{margin:0;min-height:100%;background:#000}
      body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .acg-boot{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff}
      .acg-boot-card{display:flex;flex-direction:column;align-items:center;justify-content:center}
      .acg-boot-logo{display:block;width:112px;height:auto}
      .acg-boot-line{position:relative;margin-top:20px;width:64px;height:1px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.07)}
      .acg-boot-line:after{content:"";position:absolute;inset:0;width:50%;background:#195be1;animation:acgBoot 1.05s ease-in-out infinite}
      @keyframes acgBoot{0%{transform:translateX(-110%);opacity:.28}50%{opacity:1}100%{transform:translateX(210%);opacity:.28}}
      @media (prefers-reduced-motion:reduce){.acg-boot-line:after{animation:none;transform:translateX(50%);opacity:1}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="acg-boot" role="status" aria-label="Loading ACG Trader">
        <div class="acg-boot-card">
          <img class="acg-boot-logo" src="/acg-logo.png" alt="ACG" />
          <div class="acg-boot-line" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

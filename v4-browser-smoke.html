<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V4 Browser Acceptance Fixture (no backend)</title>
  <style>
    html,body{margin:0;padding:0;background:#000;color:white;font-family:system-ui,sans-serif}
    #fixture{flex:0 0 330px;width:330px;height:620px;margin:16px;overflow:hidden}
    #v4-smoke-status{display:block;margin:16px;color:#fff;font:12px monospace}
  </style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:flex-start">
<div id="fixture"><div id="root" style="width:100%;height:100%"></div></div>
<div id="chart-fixture" style="position:relative;width:560px;height:620px;margin:16px 0;background:#0b0b0e;overflow:hidden"></div>
<div id="pending-chart-fixture" style="position:relative;width:560px;height:620px;margin:16px 0;background:#0b0b0e;overflow:hidden"></div>
<div id="position-chart-fixture" style="position:relative;width:435px;height:620px;margin:16px 0;background:#0b0b0e;overflow:hidden"></div>
<div id="protection-draft-fixture" style="position:relative;width:435px;height:620px;margin:16px 0;background:#0b0b0e;overflow:hidden"></div>
<div id="v4-independent-chart-fixture" style="position:relative;width:435px;height:620px;margin:16px 0;background:#090b0e;overflow:hidden"></div>
</div>
<output id="v4-smoke-status">WAITING</output>
<script type="module" src="/src/v4BrowserSmokeMain.jsx"></script>
</body>
</html>

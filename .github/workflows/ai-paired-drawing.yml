name: Paired native AI drawing acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/components/ai/**'
      - 'src/pages/MobileTraderShell.jsx'
      - 'src/components/trading-v2/**'
      - 'src/v4PositionsAuditMain.jsx'
      - 'src/mobileAuditBrowserMain.jsx'
      - 'tests/ui/ai-paired-drawing.mjs'
      - '.github/workflows/ai-paired-drawing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-paired-drawing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-drawing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ACG_AI_ISOLATED_CI: 'true'
      MONGODB_URI: mongodb://127.0.0.1:27017/acg_trader_test?replicaSet=rs0
      MARKET_GATEWAY_ENABLED: 'false'
      TRADING_API_ENABLED: 'true'
      PLATFORM_EVENTS_ENABLED: 'false'
      CORS_ORIGINS: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: abhilashalphonse/acg-trader-backend
          ref: 473275efbf5b4aae84c5ab6460730dc14dd8b4f2
          token: ${{ secrets.ACG_E2E_REPO_READ_TOKEN }}
          path: backend
          persist-credentials: false
      - name: Verify immutable commit pair
        run: |
          test "$(git -C backend rev-parse HEAD)" = "473275efbf5b4aae84c5ab6460730dc14dd8b4f2"
          test "$(git -C frontend rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      - name: Install locked dependencies and browser controller
        run: |
          (cd backend && npm ci --no-audit)
          (cd frontend && npm ci --no-audit && npm install --no-save --no-audit --no-fund playwright@1.56.1)
          command -v google-chrome || command -v google-chrome-stable
      - name: Start development-only browser fixture
        run: |
          (cd frontend && VITE_ACG_EXECUTION_V4_ENABLED=true VITE_ACG_DOCK_LIVE_ENABLED=true VITE_ACG_TRADER_API_BASE=http://127.0.0.1:65534 VITE_ACG_TRADER_WS_URL=ws://127.0.0.1:65534 npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/acg-paired-drawing-vite.log 2>&1) &
          echo $! > /tmp/acg-paired-drawing-vite.pid
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/mobile-audit-browser.html >/dev/null
      - name: Run real MongoDB, staff authentication, consent, detector and mounted native chart acceptance
        env:
          ACG_AI_PAIRED_BROWSER: 'true'
        run: cd backend && node scripts/ai-funded-workspace-acceptance.js
      - if: always()
        run: if [ -f /tmp/acg-paired-drawing-vite.pid ]; then kill "$(cat /tmp/acg-paired-drawing-vite.pid)" 2>/dev/null || true; fi

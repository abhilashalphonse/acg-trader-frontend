name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser V4 330px and double-click smoke
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/v4-browser-smoke.mjs
      - name: Upload in-chart visual QA screenshot
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: chart-order-qa
          path: artifacts/chart-order-qa.png
          retention-days: 7

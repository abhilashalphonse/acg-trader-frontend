name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Block high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Assert production bundle contains no public dock mock pages
        if: ${{ github.head_ref == 'ui/v4-single-row-dock-20261114' || github.ref == 'refs/heads/ui/v4-single-row-dock-20261114' }}
        run: |
          test ! -f dist/v4-dock-preview.html
          test ! -f dist/v4-positions-audit.html
          echo 'Only the authenticated URL-gated audit is available in production builds.'
      - name: Verify V4 dock public preview mounts in Chrome
        if: ${{ github.head_ref == 'ui/v4-single-row-dock-20261114' || github.ref == 'refs/heads/ui/v4-single-row-dock-20261114' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-dock-preview-vite.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-dock-preview.html >/dev/null
          node tests/ui/v4-dock-public-preview.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: V4 dock empty-state and default-layout browser acceptance
        if: ${{ github.head_ref == 'fix/v4-dock-empty-state-auto-compact-20261115' || github.ref == 'refs/heads/fix/v4-dock-empty-state-auto-compact-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-dock-empty-vite.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
      - name: Unified V4 positions and pending browser acceptance
        if: ${{ github.head_ref == 'ui/v4-unified-positions-bybit-binance-20261115' || github.ref == 'refs/heads/ui/v4-unified-positions-bybit-binance-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-unified-vite.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: No-position message without footer (browser acceptance)
        if: ${{ github.head_ref == 'fix/v4-audit-empty-message-no-footer-20261115' || github.ref == 'refs/heads/fix/v4-audit-empty-message-no-footer-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-empty-message.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
      - name: All four audit tabs empty-state and regression browser acceptance
        if: ${{ github.head_ref == 'fix/v4-audit-all-empty-tabs-no-footer-20261115' || github.ref == 'refs/heads/fix/v4-audit-all-empty-tabs-no-footer-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-all-empty-tabs.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          node tests/ui/v4-all-empty-tabs-no-footer.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: PR144 mini terminal and unified dock browser acceptance
        if: ${{ github.head_ref == 'feat/integrate-pr144-mini-terminal-audit-20261115' || github.ref == 'refs/heads/feat/integrate-pr144-mini-terminal-audit-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-mini-audit.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          npm run test:ui:mini
          node tests/ui/v4-floating-v2-theme.mjs
          node tests/ui/v4-all-empty-tabs-no-footer.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: Simple floating widget pop-out and audit regression
        if: ${{ github.head_ref == 'ui/v4-simple-floating-pip-20261115' || github.ref == 'refs/heads/ui/v4-simple-floating-pip-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-simple-mini.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          npm run test:ui:mini
          node tests/ui/v4-floating-v2-theme.mjs
          node tests/ui/v4-all-empty-tabs-no-footer.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: Upload simple mini terminal visual reference
        if: ${{ always() && (github.head_ref == 'ui/v4-simple-floating-pip-20261115' || github.ref == 'refs/heads/ui/v4-simple-floating-pip-20261115') }}
        uses: actions/upload-artifact@v4
        with:
          name: simple-floating-popup-review
          path: tests/ui/artifacts/mini-terminal-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Dense mini popup and existing trader regression
        if: ${{ github.head_ref == 'ui/v4-mini-dense-bybit-20261115' || github.ref == 'refs/heads/ui/v4-mini-dense-bybit-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-dense-mini.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          npm run test:ui:mini
          node tests/ui/v4-floating-v2-theme.mjs
          node tests/ui/v4-all-empty-tabs-no-footer.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: Upload mini window density screenshots
        if: ${{ always() && (github.head_ref == 'ui/v4-mini-dense-bybit-20261115' || github.ref == 'refs/heads/ui/v4-mini-dense-bybit-20261115') }}
        uses: actions/upload-artifact@v4
        with:
          name: dense-mini-popup-review
          path: tests/ui/artifacts/mini-terminal-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Popup-only mini terminal and unchanged default V4 acceptance
        if: ${{ github.head_ref == 'ui/v4-popup-only-no-floating-20261115' || github.ref == 'refs/heads/ui/v4-popup-only-no-floating-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-popup-only.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          npm run test:ui:mini
          node tests/ui/v4-floating-v2-theme.mjs
          node tests/ui/v4-all-empty-tabs-no-footer.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: Reference mini-terminal visual geometry and trading acceptance
        if: ${{ github.head_ref == 'ui/v4-mini-reference-layout-20261116' || github.ref == 'refs/heads/ui/v4-mini-reference-layout-20261116' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-reference-mini.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          npm run test:ui:mini
          node tests/ui/v4-floating-v2-theme.mjs
          node tests/ui/v4-all-empty-tabs-no-footer.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: Capture reference mini-terminal screenshots
        if: ${{ always() && (github.head_ref == 'ui/v4-mini-reference-layout-20261116' || github.ref == 'refs/heads/ui/v4-mini-reference-layout-20261116') }}
        uses: actions/upload-artifact@v4
        with:
          name: acg-mini-reference-review
          path: tests/ui/artifacts/mini-terminal-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Mobile audit real-Chrome responsive and interaction acceptance
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/mobile-audit-') || startsWith(github.ref, 'refs/heads/fix/mobile-audit-') || startsWith(github.head_ref, 'fix/mobile-audit-') || startsWith(github.head_ref, 'fix/v4-signout-') }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node tests/ui/mobile-audit.mjs
          node tests/ui/mobile-v4-management.mjs
          node tests/ui/mobile-v4-completion.mjs
          node tests/ui/mobile-v4-workspaces.mjs
          node tests/ui/mobile-v4-markets.mjs
      - name: Upload Mobile audit evidence
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/mobile-audit-') || startsWith(github.ref, 'refs/heads/fix/mobile-audit-') || startsWith(github.head_ref, 'fix/mobile-audit-') || startsWith(github.head_ref, 'fix/v4-signout-') }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-responsive
          path: |
            artifacts/mobile-audit-*.png
            artifacts/mobile-v4-*.png
          retention-days: 7
      - name: Browser V4 330px and double-click smoke
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/v4-browser-smoke.mjs
      - name: Upload in-chart visual QA screenshot
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: chart-order-qa
          path: artifacts/chart-order-qa.png
          retention-days: 7

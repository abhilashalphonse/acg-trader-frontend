          node tests/ui/v4-floating-v2-theme.mjs
          node tests/ui/v4-all-empty-tabs-no-footer.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs

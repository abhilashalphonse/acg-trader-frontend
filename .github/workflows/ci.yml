name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Mobile audit real-Chrome responsive and interaction acceptance
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/mobile-audit-') || startsWith(github.ref, 'refs/heads/fix/mobile-audit-') || startsWith(github.head_ref, 'fix/mobile-audit-') }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node tests/ui/mobile-audit.mjs
          node tests/ui/mobile-v4-management.mjs
          node tests/ui/mobile-v4-completion.mjs
          node tests/ui/mobile-v4-workspaces.mjs
          node tests/ui/mobile-v4-markets.mjs
      - name: Upload Mobile audit evidence
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/mobile-audit-') || startsWith(github.ref, 'refs/heads/fix/mobile-audit-') || startsWith(github.head_ref, 'fix/mobile-audit-') }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-responsive
          path: |
            artifacts/mobile-audit-*.png
            artifacts/mobile-v4-*.png
          retention-days: 7
      - name: Browser V4 330px and double-click smoke
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/v4-browser-smoke.mjs
      - name: Upload in-chart visual QA screenshot
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: chart-order-qa
          path: artifacts/chart-order-qa.png
          retention-days: 7

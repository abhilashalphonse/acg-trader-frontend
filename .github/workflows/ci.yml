name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject exposed privileged keys and conflicted env templates
        run: node scripts/security/check-tracked-secrets.mjs
      - name: Install dependencies
        run: npm ci
      - name: Block high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install FFmpeg probe for media release checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build first-party silent fast-start cinematic media
        run: node scripts/prepare-landing-films.mjs
      - name: Audit first-party cinematic MP4 files for mobile compatibility
        run: node scripts/landing-media-audit.mjs
      - name: Cinematic landing video browser acceptance
        if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'fix/mobile-video-media-audit-20261121' || github.ref == 'refs/heads/fix/mobile-video-media-audit-20261121' || github.head_ref == 'design/mobile-landing-composition-audit-20261121' || github.ref == 'refs/heads/design/mobile-landing-composition-audit-20261121' || github.head_ref == 'fix/landing-autoplay-no-buttons-20261121' || github.ref == 'refs/heads/fix/landing-autoplay-no-buttons-20261121' || github.head_ref == 'fix/mobile-video-playback-fallback-20261121' || github.ref == 'refs/heads/fix/mobile-video-playback-fallback-20261121' || github.head_ref == 'fix/https-transport-guard-20261121' || github.ref == 'refs/heads/fix/https-transport-guard-20261121' || github.head_ref == 'design/landing-footer-polish-20261121' || github.ref == 'refs/heads/design/landing-footer-polish-20261121' || github.head_ref == 'feat/faq-terms-risk-disclaimer-20261121' || github.ref == 'refs/heads/feat/faq-terms-risk-disclaimer-20261121' || github.head_ref == 'feat/landing-revolut-style-faq-20261121' || github.ref == 'refs/heads/feat/landing-revolut-style-faq-20261121' || github.head_ref == 'remove/workflow-market-catalog-sections-20261121' || github.ref == 'refs/heads/remove/workflow-market-catalog-sections-20261121' || github.head_ref == 'fix/section7-hero-scale-seamless-20261121' || github.ref == 'refs/heads/fix/section7-hero-scale-seamless-20261121' || github.head_ref == 'fix/section7-seamless-black-no-caption-20261121' || github.ref == 'refs/heads/fix/section7-seamless-black-no-caption-20261121' || github.head_ref == 'feat/section7-market-movers-split-20261121' || github.ref == 'refs/heads/feat/section7-market-movers-split-20261121' || github.head_ref == 'feat/section6-overnight-scan-video-20261121' || github.ref == 'refs/heads/feat/section6-overnight-scan-video-20261121' || github.head_ref == 'fix/section2-show-entire-btc-video-20261121' || github.ref == 'refs/heads/fix/section2-show-entire-btc-video-20261121' || github.head_ref == 'copy/section6-third-party-ai-disclaimer-20261121' || github.ref == 'refs/heads/copy/section6-third-party-ai-disclaimer-20261121' || github.head_ref == 'fix/compact-ai-connection-section-20261121' || github.ref == 'refs/heads/fix/compact-ai-connection-section-20261121' || github.head_ref == 'feat/landing-section6-ai-connections-20261121' || github.ref == 'refs/heads/feat/landing-section6-ai-connections-20261121' || github.head_ref == 'feat/section2-btc-prism-swirl-20261121' || github.ref == 'refs/heads/feat/section2-btc-prism-swirl-20261121' || github.head_ref == 'feat/terminal-section-four-mobile-section-five-20261121' || github.ref == 'refs/heads/feat/terminal-section-four-mobile-section-five-20261121' || github.head_ref == 'feat/mobile-trading-section-four-20261121' || github.ref == 'refs/heads/feat/mobile-trading-section-four-20261121' || github.head_ref == 'design/ai-prism-section-three-20261121' || github.ref == 'refs/heads/design/ai-prism-section-three-20261121' || github.head_ref == 'feat/responsive-logo-free-prism-hero-20261121' || github.ref == 'refs/heads/feat/responsive-logo-free-prism-hero-20261121' || github.head_ref == 'design/revolut-motion-films-20261120' || github.ref == 'refs/heads/design/revolut-motion-films-20261120' || github.head_ref == 'design/market-shield-film-ux-20261120' || github.ref == 'refs/heads/design/market-shield-film-ux-20261120' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node scripts/landing-video-smoke.mjs
      - name: Upload cinematic landing review screenshots
        if: ${{ always() && (github.ref == 'refs/heads/main' || github.head_ref == 'design/mobile-landing-composition-audit-20261121' || github.ref == 'refs/heads/design/mobile-landing-composition-audit-20261121' || github.head_ref == 'fix/landing-autoplay-no-buttons-20261121' || github.ref == 'refs/heads/fix/landing-autoplay-no-buttons-20261121' || github.head_ref == 'fix/mobile-video-playback-fallback-20261121' || github.ref == 'refs/heads/fix/mobile-video-playback-fallback-20261121' || github.head_ref == 'fix/https-transport-guard-20261121' || github.ref == 'refs/heads/fix/https-transport-guard-20261121' || github.head_ref == 'design/landing-footer-polish-20261121' || github.ref == 'refs/heads/design/landing-footer-polish-20261121' || github.head_ref == 'feat/faq-terms-risk-disclaimer-20261121' || github.ref == 'refs/heads/feat/faq-terms-risk-disclaimer-20261121' || github.head_ref == 'feat/landing-revolut-style-faq-20261121' || github.ref == 'refs/heads/feat/landing-revolut-style-faq-20261121' || github.head_ref == 'remove/workflow-market-catalog-sections-20261121' || github.ref == 'refs/heads/remove/workflow-market-catalog-sections-20261121' || github.head_ref == 'fix/section7-hero-scale-seamless-20261121' || github.ref == 'refs/heads/fix/section7-hero-scale-seamless-20261121' || github.head_ref == 'fix/section7-seamless-black-no-caption-20261121' || github.ref == 'refs/heads/fix/section7-seamless-black-no-caption-20261121' || github.head_ref == 'feat/section7-market-movers-split-20261121' || github.ref == 'refs/heads/feat/section7-market-movers-split-20261121' || github.head_ref == 'feat/section6-overnight-scan-video-20261121' || github.ref == 'refs/heads/feat/section6-overnight-scan-video-20261121' || github.head_ref == 'fix/section2-show-entire-btc-video-20261121' || github.ref == 'refs/heads/fix/section2-show-entire-btc-video-20261121' || github.head_ref == 'copy/section6-third-party-ai-disclaimer-20261121' || github.ref == 'refs/heads/copy/section6-third-party-ai-disclaimer-20261121' || github.head_ref == 'fix/compact-ai-connection-section-20261121' || github.ref == 'refs/heads/fix/compact-ai-connection-section-20261121' || github.head_ref == 'feat/landing-section6-ai-connections-20261121' || github.ref == 'refs/heads/feat/landing-section6-ai-connections-20261121' || github.head_ref == 'feat/section2-btc-prism-swirl-20261121' || github.ref == 'refs/heads/feat/section2-btc-prism-swirl-20261121' || github.head_ref == 'feat/terminal-section-four-mobile-section-five-20261121' || github.ref == 'refs/heads/feat/terminal-section-four-mobile-section-five-20261121' || github.head_ref == 'feat/mobile-trading-section-four-20261121' || github.ref == 'refs/heads/feat/mobile-trading-section-four-20261121' || github.head_ref == 'design/ai-prism-section-three-20261121' || github.ref == 'refs/heads/design/ai-prism-section-three-20261121' || github.head_ref == 'feat/responsive-logo-free-prism-hero-20261121' || github.ref == 'refs/heads/feat/responsive-logo-free-prism-hero-20261121' || github.head_ref == 'design/revolut-motion-films-20261120' || github.ref == 'refs/heads/design/revolut-motion-films-20261120' || github.head_ref == 'design/market-shield-film-ux-20261120' || github.ref == 'refs/heads/design/market-shield-film-ux-20261120') }}
        uses: actions/upload-artifact@v4
        with:
          name: acg-landing-film-desktop-mobile
          path: |
            artifacts/landing-film-*.png
            artifacts/ai-section-*.png
            artifacts/ai-connection-section-*.png
            artifacts/market-movers-*.png
            artifacts/acg-faq-*.png
            artifacts/acg-footer-*.png
            artifacts/account-access-mobile-audited.png
            artifacts/movers-mobile-audited.png
            artifacts/terminal-mobile-audited.png
            artifacts/ai-assistant-mobile-audited.png
            artifacts/mobile-story-*.png
            artifacts/markets-btc-swirl-*.png
            artifacts/terminal-story-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Assert production bundle contains no public dock mock pages
        if: ${{ github.head_ref == 'ui/v4-single-row-dock-20261114' || github.ref == 'refs/heads/ui/v4-single-row-dock-20261114' }}
        run: |
          test ! -f dist/v4-dock-preview.html
          test ! -f dist/v4-positions-audit.html
          echo 'Only the authenticated URL-gated audit is available in production builds.'
      - name: Verify V4 dock public preview mounts in Chrome
        if: ${{ github.head_ref == 'ui/v4-single-row-dock-20261114' || github.ref == 'refs/heads/ui/v4-single-row-dock-20261114' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-dock-preview-vite.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-dock-preview.html >/dev/null
          node tests/ui/v4-dock-public-preview.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: V4 dock empty-state and default-layout browser acceptance
        if: ${{ github.head_ref == 'fix/v4-dock-empty-state-auto-compact-20261115' || github.ref == 'refs/heads/fix/v4-dock-empty-state-auto-compact-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-dock-empty-vite.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-positions-reference.mjs
      - name: Unified V4 positions and pending browser acceptance
        if: ${{ github.head_ref == 'ui/v4-unified-positions-bybit-binance-20261115' || github.ref == 'refs/heads/ui/v4-unified-positions-bybit-binance-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-unified-vite.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null
          node tests/ui/v4-positions-reference.mjs
          node tests/ui/v4-pending-reference.mjs
          node tests/ui/v4-dock-empty-state.mjs
          node tests/ui/v4-dock-audit-isolation.mjs
          node tests/ui/v4-workspace-corrections.mjs
      - name: No-position message without footer (browser acceptance)
        if: ${{ github.head_ref == 'fix/v4-audit-empty-message-no-footer-20261115' || github.ref == 'refs/heads/fix/v4-audit-empty-message-no-footer-20261115' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          VITE_ACG_EXECUTION_V4_ENABLED=true npm run dev -- --host 127.0.0.1 >/tmp/v4-empty-message.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-positions-audit.html >/dev/null

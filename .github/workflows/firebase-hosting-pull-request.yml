name: Preview ACG Trader on Firebase Hosting

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: acg-trader-firebase-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify V4 STAGING Trader readiness
        if: ${{ (github.event.pull_request.number == 90 || github.event.pull_request.head.ref == 'feat/desktop-chart-order-levels') }}
        run: |
          set -euo pipefail
          base='https://discerning-presence-staging.up.railway.app'
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 25 "$base/health/live" >/dev/null
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 25 "$base/health/ready" >/dev/null
          echo 'Staging Trader live and readiness checks returned HTTP success.'

      - name: Verify STAGING CORS allows the V4 Firebase preview
        # The original known origin only belongs to PR #90.
        # The chart-order preview origin is checked after Firebase supplies its URL.
        if: ${{ github.event.pull_request.number == 90 }}
        run: |
          set -euo pipefail
          origin='https://acg-trader--pr-90-ois6tr16.web.app'
          base='https://discerning-presence-staging.up.railway.app'
          headers="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --dump-header - --output /dev/null --header "Origin: $origin" "$base/health/live")"
          if ! printf '%s\n' "$headers" | grep -qiF "access-control-allow-origin: $origin"; then
            echo '::error::Railway STAGING does not permit the V4 Firebase preview Origin. Correct STAGING CORS_ORIGINS first; do not deploy the preview as a usable staging trading terminal.'
            exit 1
          fi
          echo 'Staging CORS permits the isolated V4 preview Origin.'

      - name: Build preview
        run: npm run build
        env:
          # The chart-order feature branch also builds against STAGING; never test new chart actions against production.
          # Every other PR retains its original endpoints and legacy UI.
          VITE_ACG_TRADER_API_BASE: ${{ (github.event.pull_request.number == 90 || github.event.pull_request.head.ref == 'feat/desktop-chart-order-levels') && 'https://discerning-presence-staging.up.railway.app' || secrets.VITE_ACG_TRADER_API_BASE }}
          VITE_ACG_TRADER_WS_URL: ${{ (github.event.pull_request.number == 90 || github.event.pull_request.head.ref == 'feat/desktop-chart-order-levels') && 'wss://discerning-presence-staging.up.railway.app/v1/ws' || secrets.VITE_ACG_TRADER_WS_URL }}
          VITE_ACG_EXECUTION_V4_ENABLED: ${{ (github.event.pull_request.number == 90 || github.event.pull_request.head.ref == 'feat/desktop-chart-order-levels') && 'true' || 'false' }}
          VITE_ACG_TRADER_HTTP_TIMEOUT_MS: 10000
          VITE_ACG_FUNDED_SUPPORT_BASE_URL: ${{ secrets.VITE_ACG_FUNDED_SUPPORT_STAGING_BASE_URL }}
          VITE_GIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Verify V4 PR staging isolation
        if: ${{ (github.event.pull_request.number == 90 || github.event.pull_request.head.ref == 'feat/desktop-chart-order-levels') }}
        run: |
          test -d dist/assets
          # Vite includes the baked API/WS targets in the client bundle.
          grep -qrF 'discerning-presence-staging.up.railway.app' dist/assets
          grep -qrF 'ACG Trader V4 live execution ticket' dist/assets
          echo 'Isolated V4 preview built against STAGING Trader API; no production deployment.'

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACG_TRADER }}
          projectId: acg-trader
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

      - name: Verify chart-order preview Origin against STAGING CORS
        if: ${{ github.event.pull_request.head.ref == 'feat/desktop-chart-order-levels' }}
        run: |
          set -euo pipefail
          origin='https://acg-trader--pr-97-v1thyrgt.web.app'
          base='https://discerning-presence-staging.up.railway.app'
          headers="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --dump-header - --output /dev/null --header "Origin: $origin" "$base/health/live")"
          if ! printf '%s\n' "$headers" | grep -qiF "access-control-allow-origin: $origin"; then
            echo '::error::STAGING backend does not currently allow chart-order Firebase preview Origin. Do not run authenticated trading acceptance on this preview.'
            exit 1
          fi
          # Exercise the browser's actual POST/PATCH preflight contract for
          # pending creation and amendment, without sending trading commands.
          for case in 'POST /v1/trading/orders/pending' 'PATCH /v1/trading/orders/chart-order-check'; do
            method="${case%% *}"
            path="${case#* }"
            preflight="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              --request OPTIONS --dump-header - --output /dev/null \
              --header "Origin: $origin" \
              --header "Access-Control-Request-Method: $method" \
              --header 'Access-Control-Request-Headers: authorization,content-type' \
              "$base$path")"
            printf '%s\n' "$preflight" | grep -qiF "access-control-allow-origin: $origin" || {
              echo "::error::STAGING CORS preflight rejected $method $path Origin"; exit 1;
            }
            printf '%s\n' "$preflight" | grep -qiF 'access-control-allow-credentials: true' || {
              echo "::error::STAGING CORS credentials not allowed for $method $path"; exit 1;
            }
            printf '%s\n' "$preflight" | grep -Ei '^access-control-allow-methods:' | grep -qi "$method" || {
              echo "::error::STAGING CORS method $method not allowed for $path"; exit 1;
            }
          done
          echo 'Confirmed chart-order Firebase preview Origin and POST/PATCH preflights are allowed by STAGING Trader.'

  live-startup-smoke:
    if: ${{ github.event.pull_request.number == 107 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install read-only browser test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify deployed ACG Trader startup without credentials
        run: node tests/ui/live-startup-diagnostic.mjs

  v4-six-regressions-browser:
    if: ${{ github.event.pull_request.number == 107 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install test browser controller
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Launch V4 full-terminal fixture
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/v4-qa-vite.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/v4-six-fixes-audit.html >/dev/null
        env:
          VITE_ACG_TRADER_API_BASE: http://localhost:4000
          VITE_ACG_TRADER_WS_URL: ws://localhost:4000/v1/ws
          VITE_ACG_EXECUTION_V4_ENABLED: 'true'
      - name: Exercise six V4 chart regressions in real Chrome
        run: node tests/ui/v4-six-regressions.mjs

  # Temporary one-shot owner audit deployment for the V4 no-All category alignment and Favorites grouping.
  # PR #107 remains draft and unmerged; normal users remain on the old ticket.
  v4-markets-category-owner-audit:
    if: ${{ github.event.pull_request.number == 107 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/v4-isolated-chart-layer-foundation' }}
    needs: [preview, v4-six-regressions-browser, live-startup-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_ACG_TRADER_API_BASE: https://acg-trader-backend-production.up.railway.app
      VITE_ACG_TRADER_WS_URL: wss://acg-trader-backend-production.up.railway.app/v1/ws
      VITE_ACG_EXECUTION_V4_ENABLED: 'true'
      VITE_ACG_TRADER_HTTP_TIMEOUT_MS: 10000
      VITE_ACG_FUNDED_SUPPORT_BASE_URL: ${{ secrets.VITE_ACG_FUNDED_SUPPORT_BASE_URL }}
      VITE_GIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout this audited V4 branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify approved management-only changes and original New Order hashes
        run: |
          set -euo pipefail
          test "$(git hash-object src/components/trading-v2/desktop/DesktopOrderTicketV4.jsx)" = "dd462209f12861d264e5f08577f4b2a7bc856713"
          test "$(git hash-object src/components/trading-v2/desktop/DesktopOrderTicketV4.css)" = "e499ee60eced938b226a17a7aaf1ee980b0cc915"
          grep -q 'v4AuditLayer = desktopEnhanced && chartOrderV4 && !mobileOverlayStyle' src/components/trading-v2/ChartArea.jsx
          grep -q 'partialOpen&&' src/components/trading-v2/desktop/DesktopManagePositionV4.jsx
          grep -q 'v4-manage-inline-confirm' src/components/trading-v2/desktop/DesktopManagePositionV4.jsx
          grep -q 'v4-manage-pending-metrics' src/components/trading-v2/desktop/DesktopManagePendingV4.jsx
          grep -q 'color:#121214;background:#f2f2f4' src/components/trading-v2/desktop/DesktopManagePositionV4.css
          grep -q 'background:#17171a' src/components/trading-v2/desktop/DesktopManagePositionV4.css
          grep -q 'pendingReview?' src/components/trading-v2/desktop/DesktopOrderTicketV4.jsx
          grep -q 'v4-pending-review-actions' src/components/trading-v2/desktop/DesktopOrderTicketV4.css
          grep -q 'Selecting SELL submitted a pending order' src/v4BrowserSmokeMain.jsx
          grep -q 'conversionQuoteSymbolsForInstrument' src/App.jsx
          grep -q 'receivedAtMs: quote?.receivedAtMs' src/hooks/useMarketData.js
          grep -q 'convertFreshFx' src/utils/tradingRisk.js
          grep -q 'fxRequired' src/components/trading-v2/desktop/DesktopOrderTicketV4.jsx
          test -f tests/verifiedFxConversion.test.js
          test -f tests/v4MarketsDiscovery.test.js
          grep -q 'V4_MARKETS_AUDIT && (mode ===' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'V4_MARKET_CATEGORIES' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'Market options' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'Stock markets' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'v4StockListingCountry' src/utils/v4MarketsDiscovery.js
          grep -q 'Favorites shows existing starred instruments' tests/ui/v4-six-regressions.mjs
          test -f src/components/trading-v2/desktop/DesktopMarketsV4.css
          grep -q 'data-v4-market-scroll' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'acg-v4-market-column-header' src/components/trading-v2/desktop/DesktopMarketsV4.css
          grep -q 'data-v4-change' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'Market panel does not overflow' tests/ui/v4-six-regressions.mjs
          grep -q 'No redundant row Favorites star' tests/ui/v4-six-regressions.mjs
          grep -q 'buildV4MarketSections' src/utils/v4MarketsDiscovery.js
          grep -q 'Global search finds an index without All category' tests/ui/v4-six-regressions.mjs
          grep -q 'Category navigation does not scroll or clip' tests/ui/v4-six-regressions.mjs
          grep -q 'acg-v4-market-categories' src/components/trading-v2/desktop/DesktopMarketsV4.css
          grep -q 'data-v4-market-section' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'data-v4-markets-panel' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'onViewportQuoteSymbolsChange' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          grep -q 'selectV4Markets' src/utils/v4MarketsDiscovery.js
          grep -q 'VITE_ACG_EXECUTION_V4_ENABLED' src/components/trading-v2/desktop/DesktopWatchlist.jsx
          if grep -q 'ORDER ACTIONS' src/components/trading-v2/desktop/DesktopManagePendingV4.jsx; then
            echo "::error::Duplicate Pending Order Actions disclosure reappeared"; exit 1
          fi
      - name: Check production backend health before deployment
        run: curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 25 https://acg-trader-backend-production.up.railway.app/health/live >/dev/null
      - name: Re-run frontend release quality gate
        run: npm run check
      - name: Verify opt-in V4 and canonical production endpoints in built bundle
        run: |
          set -euo pipefail
          grep -qrF 'acg_v4_audit' dist/assets
          grep -qrF 'wss://acg-trader-backend-production.up.railway.app/v1/ws' dist/assets
          grep -qrF 'data-v4-manage-position' dist/assets
          grep -qrF 'data-v4-manage-pending' dist/assets
          grep -qrF 'v4-manage-pending-metrics' dist/assets
          grep -qrF 'v4-pending-review-actions' dist/assets
          grep -qrF 'Place Order' dist/assets
          grep -qrF 'Live ' dist/assets
          grep -qrF 'conversion unavailable' dist/assets
          grep -qrF 'data-v4-markets-panel' dist/assets
          grep -qrF 'Search instruments...' dist/assets
          grep -qrF 'Market options' dist/assets
          grep -qrF 'Stock markets' dist/assets
          grep -qrF 'acg-v4-market-column-header' dist/assets
          grep -qrF 'data-v4-change' dist/assets
          grep -qrF 'BID / LAST' dist/assets
          grep -qrF 'acg-v4-market-categories' dist/assets
          grep -qrF 'data-v4-market-section' dist/assets
      - name: Publish updated V4 to the original owner audit URL
        id: deployed
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACG_TRADER }}
          projectId: acg-trader
          channelId: live
      - name: Install read-only Chrome startup checker
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify original live URL opens correctly
        id: smoke
        run: node tests/ui/live-startup-diagnostic.mjs
      - name: Verify original opt-in audit URL boots without authentication
        id: audit_smoke
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
          try {
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const errors = [];
            page.on('pageerror',e=>errors.push(e.message));
            const response = await page.goto('https://acg-trader.web.app/?acg_v4_audit=1',{waitUntil:'domcontentloaded',timeout:25000});
            await page.waitForTimeout(8500);
            const state = await page.evaluate(()=>({
              boot:!!document.querySelector('#root > .acg-boot'),
              loader:!!document.querySelector('[aria-label="Loading ACG Trader"]'),
              mounted:(document.querySelector('#root')?.children?.length||0)>0
            }));
            console.log('V4_ORIGINAL_AUDIT_STARTUP',JSON.stringify({status:response?.status(),...state,errors}));
            if(response?.status()!==200||state.boot||state.loader||!state.mounted||errors.length)process.exitCode=1;
          } finally {await browser.close();}
          JS
      - name: Checkout last successfully audited version if this deployment breaks startup
        if: ${{ failure() && steps.deployed.outcome == 'success' && (steps.smoke.outcome == 'failure' || steps.audit_smoke.outcome == 'failure') }}
        uses: actions/checkout@v4
        with:
          ref: e4296fde1afe41473087fd9f4f1d39472a9bd28d
      - name: Restore last audited frontend bundle when startup fails
        if: ${{ failure() && steps.deployed.outcome == 'success' && (steps.smoke.outcome == 'failure' || steps.audit_smoke.outcome == 'failure') }}
        run: |
          npm ci
          npm run build
      - name: Roll back original audit URL when startup fails
        if: ${{ failure() && steps.deployed.outcome == 'success' && (steps.smoke.outcome == 'failure' || steps.audit_smoke.outcome == 'failure') }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACG_TRADER }}
          projectId: acg-trader
          channelId: live

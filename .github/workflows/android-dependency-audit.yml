name: Android dependency security audit
on:
  pull_request:
    paths:
      - '.github/workflows/android-dependency-audit.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - name: Summarize production dependency vulnerabilities
        run: |
          npm audit --omit=dev --json > audit.json || true
          node --input-type=module -e "
            import fs from 'node:fs';
            const d=JSON.parse(fs.readFileSync('audit.json','utf8'));
            console.log('production dependency vulnerabilities:',JSON.stringify(d.metadata?.vulnerabilities||{}));
            for(const [k,v] of Object.entries(d.vulnerabilities||{})) {
              if (v.severity==='high' || v.severity==='critical')
                console.log(k,':',v.severity,'fix:',JSON.stringify(v.fixAvailable));
            }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: acg-android-npm-audit
          path: audit.json
          retention-days: 3

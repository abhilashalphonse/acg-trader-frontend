name: Android production capability probe
on:
  pull_request:
    paths:
      - '.github/workflows/android-production-readiness.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live health and Supabase route availability without credentials
        run: |
          set -euo pipefail
          api='https://acg-trader-backend-production.up.railway.app'
          curl --fail --silent --show-error --max-time 20 "$api/health/ready" >/dev/null
          http=$(curl --silent --show-error --max-time 20 --output /tmp/personal.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$api/v1/auth/personal/demo")
          echo "Personal demo registration probe: $http"
          test "$http" = '401' || test "$http" = '404'
          curl --silent --show-error --max-time 20 'https://mwkwvchaqjqtyfgmialk.supabase.co/auth/v1/settings' | python3 -c 'import sys,json; j=json.load(sys.stdin); print(json.dumps({k:j.get(k) for k in ("disable_signup","external","mailer_autoconfirm") if k in j})[:2000])'
          echo 'No authentication or trade performed.'

name: Resolve ACG Trader production dependency audit

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/security-resolve-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/google-phishing-hardening-20261116' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact security branch, no merge reference
        uses: actions/checkout@v4
        with:
          ref: security/google-phishing-hardening-20261116
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove browser source does not import Firebase package
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';
          const hits=[];
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){
            const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(/\.(?:js|jsx|mjs|ts|tsx)$/.test(p)){
              const s=fs.readFileSync(p,'utf8');
              if(/(?:from\s*|import\s*\(|require\s*\()\s*['"]firebase(?:\/[^'"]*)?['"]/.test(s))hits.push(p);
            }
          }}
          walk('src');
          console.log('Firebase package import sites:',hits);
          if(hits.length){console.error('Firebase dependency is used. Refuse removal.');process.exit(1);}
          JS
      - name: Regenerate deterministic lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install, build, test, and reject high production advisories
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test
          npm run build
      - name: Commit lockfile on restricted PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
          else
            git commit -m "security: regenerate lockfile without unused Firebase SDK"
            git push origin HEAD:refs/heads/security/google-phishing-hardening-20261116
          fi

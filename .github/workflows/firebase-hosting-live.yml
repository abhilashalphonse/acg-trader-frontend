name: Deploy ACG Trader to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: acg-trader-firebase-production
  cancel-in-progress: true

env:
  VITE_ACG_TRADER_API_BASE: https://acg-trader-backend-production.up.railway.app
  VITE_ACG_TRADER_WS_URL: wss://acg-trader-backend-production.up.railway.app/v1/ws
  VITE_ACG_TRADER_HTTP_TIMEOUT_MS: 10000
  # Approved V4 desktop execution is the default for every customer.
  # A V3 emergency fallback remains accessible with ?acg_v4_audit=0.
  VITE_ACG_EXECUTION_V4_ENABLED: 'true'
  VITE_ACG_FUNDED_SUPPORT_BASE_URL: ${{ secrets.VITE_ACG_FUNDED_SUPPORT_BASE_URL }}
  VITE_GIT_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Assert V4 desktop is enabled by default in production
        run: |
          set -euo pipefail
          test "$VITE_ACG_EXECUTION_V4_ENABLED" = 'true'
          node --input-type=module -e "
            import { strict as assert } from 'node:assert';
            import { isV4DefaultEnabled } from './src/utils/chartOrderPresentation.js';
            import { isMobileV4Enabled } from './src/utils/mobileV4Presentation.js';
            assert.equal(isV4DefaultEnabled(process.env.VITE_ACG_EXECUTION_V4_ENABLED, ''), true);
            assert.equal(isV4DefaultEnabled(process.env.VITE_ACG_EXECUTION_V4_ENABLED, '?acg_v4_audit=0'), false);
            assert.equal(isV4DefaultEnabled('false', '?acg_v4_audit=1'), false);
            assert.equal(isMobileV4Enabled(''), true);
            assert.equal(isMobileV4Enabled('?acg_mobile_audit=1'), true);
            assert.equal(isMobileV4Enabled('?acg_mobile_audit=0'), false);
          "
          grep -qrF 'ACG Trader V4 live execution ticket' dist/assets
          echo 'V4 enabled by default; V3 opt-out requires an explicit support query parameter.'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACG_TRADER }}
          projectId: acg-trader
          channelId: live

      - name: Install headless startup verification
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1

      - name: Verify live customer-default startup
        run: node tests/ui/live-startup-diagnostic.mjs

name: Bootstrap versioned ACG Trader landing videos (one-time)
on:
  push:
    branches:
      - fix/version-landing-films-reduce-ci-20261122
    paths:
      - .github/workflows/bootstrap-landing-videos.yml

permissions:
  contents: write

jobs:
  import-verified-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Import and remux existing landing videos
        run: |
          set -euo pipefail
          node scripts/prepare-landing-films.mjs
          mkdir -p public/media
          cp dist/media/{hero,btc-swirl,ai-prism,terminal,overnight-scan,market-movers}.mp4 public/media/
          for file in public/media/{hero,btc-swirl,ai-prism,terminal,overnight-scan,market-movers}.mp4; do
            test -s "$file"
            ffprobe -v error -show_entries stream=codec_name,pix_fmt -of csv=p=0 "$file"
          done
      - name: Commit static films only to approved feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/hero.mp4 public/media/btc-swirl.mp4 public/media/ai-prism.mp4 public/media/terminal.mp4 public/media/overnight-scan.mp4 public/media/market-movers.mp4
          if ! git diff --cached --quiet; then
            git commit -m "assets: version existing cinematic landing MP4 files"
            git push origin HEAD:fix/version-landing-films-reduce-ci-20261122
          fi
